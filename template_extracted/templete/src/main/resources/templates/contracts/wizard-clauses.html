<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/fragment :: head"></head>
<body>
<header th:replace="fragments/fragment :: header"></header>
<aside th:replace="fragments/fragment :: sidebar"></aside>
<main class="main-content" id="mainContent">
	<h2>Step 2: Clauses</h2>
	<div class="table-container">
		<table>
			<thead><tr><th>Title</th><th>Section</th><th>Mandatory</th><th></th></tr></thead>
			<tbody>
				<tr th:each="c : ${clauses}">
					<td th:text="${c.title}">Title</td>
					<td th:text="${c.section}">Section</td>
					<td th:text="${c.mandatory} ? 'Yes' : 'No'">No</td>
					<td>
						<form th:action="@{/contracts/wizard/clauses/delete}" method="post">
							<input type="hidden" name="contractId" th:value="${contract.id}">
							<input type="hidden" name="clauseId" th:value="${c.id}">
							<button type="submit">Remove</button>
						</form>
					</td>
				</tr>
			</tbody>
		</table>
	</div>
	<h3>Add Clause</h3>
	<form th:action="@{/contracts/wizard/clauses/add}" method="post">
		<input type="hidden" name="contractId" th:value="${contract.id}">
		<input type="text" name="title" placeholder="Title" required>
		<textarea name="content" placeholder="Content" required></textarea>
		<input type="text" name="section" placeholder="Section">
		<label><input type="checkbox" name="mandatory"> Mandatory</label>
		<button type="submit">Add</button>
	</form>
	<form th:action="@{/contracts/wizard/clauses/next}" method="post" class="mt-2">
		<input type="hidden" name="contractId" th:value="${contract.id}">
		<button type="submit">Next</button>
	</form>
</main>
<footer th:replace="fragments/fragment :: footer"></footer>
<script th:replace="fragments/fragment :: sidebar-script"></script>
</body>
</html>
