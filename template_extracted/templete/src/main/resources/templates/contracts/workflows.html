<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head th:replace="fragments/fragment :: head"></head>
<body>
<header th:replace="fragments/fragment :: header"></header>
<aside th:replace="fragments/fragment :: sidebar"></aside>
<main class="main-content" id="mainContent">
	<h2>Approval Workflows</h2>
	<div class="table-container">
		<table>
			<thead><tr><th>Name</th><th>Steps</th><th>Current</th><th>Completed</th><th></th></tr></thead>
			<tbody>
				<tr th:each="w : ${workflows}">
					<td th:text="${w.name}">Name</td>
					<td th:text="${w.numberOfSteps}">0</td>
					<td th:text="${w.currentStep}">0</td>
					<td th:text="${w.completed}">false</td>
					<td><a th:href="@{'/contracts/workflows/view/' + ${w.id}}">View</a></td>
				</tr>
			</tbody>
		</table>
	</div>
</main>
<footer th:replace="fragments/fragment :: footer"></footer>
<script th:replace="fragments/fragment :: sidebar-script"></script>
</body>
</html>
