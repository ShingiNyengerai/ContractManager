<!DOCTYPE html>
<html xmlns:th="http://www.thymeleaf.org">
<head>
	<meta charset="UTF-8">
	<title>Workflow Detail</title>
</head>
<body>
	<div th:replace="fragments/fragment :: header"></div>
	<div class="container p-3">
		<h2 th:text="${workflow.name}">Workflow</h2>
		<p>Progress: <span th:text="${workflow.currentStep}">0</span>/<span th:text="${workflow.numberOfSteps}">0</span></p>
		<p>Completed: <span th:text="${workflow.completed}">false</span></p>
		<form th:action="@{'/contracts/workflows/' + ${workflow.id} + '/advance'}" method="post">
			<button class="btn btn-primary" type="submit">Advance</button>
		</form>
		<form class="mt-2" th:action="@{'/contracts/workflows/' + ${workflow.id} + '/reset'}" method="post">
			<button class="btn btn-secondary" type="submit">Reset</button>
		</form>
	</div>
	<div th:replace="fragments/fragment :: footer"></div>
</body>
</html>
